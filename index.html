<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>Siamo的委託頁</title>
    <link rel="icon" href="img/HomeIcon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="Image/Title.png">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <link href="./css/card.css" rel="stylesheet" type="text/css" media="all"> 
    <link href="./css/global.css" rel="stylesheet" type="text/css" media="all">
    <link href="./css/navbar.css" rel="stylesheet" type="text/css" media="all"> 
  </head>
  

  <body>
    
    <div style="padding-left: 5%;">
      <!-- 🔹 固定置頂的功能選單列 -->
      <!-- <div class="navbar">
        <h1>&nbsp;&nbsp;<img src="img/HomeIcon.png">&nbsp;&nbsp;Siamo 委託頁</h1>
      </div> -->
      
      <div style="height:10px;"></div> 

      <div class=""style="width: 95%; margin-bottom:10px;" >
        <div class="row g-0" style="padding-left: 5%;">

          <div class="col-6">
            <img src="img/profile.png" style="width:100%; aspect-ratio: 1 / 1;">
          </div>

          <div class="col-6" style="padding-top:5%">
            <div class="card card-a w-100 word-card" style="aspect-ratio: 1 / 0.8; border-radius: 150px; background-color: rgba(231, 207, 212, 0.8); color: var(--main-card-bg);font-size: 0.8rem;border: 0px;">
              <p>歡迎查看我的委託頁<i class="fa-solid fa-heart"></i></p>
              擅長畫暖色系<br/>
              常被Message吃訊息而漏私訊<br/>我會盡量檢查&nbsp;TT
            </div> 
          </div>
        </div>
      </div>
      

      <div class=""style="width: 95%; margin-bottom:50px;" >
        <div class="row g-1" style="padding-left: 5%;">

          <div class="col-1"></div>

          <div class="col-2">
            <button class="homeCard card-a" onclick="InfoChange('about')">
              <i class="fa-regular fa-id-badge"></i><br/>
              關於
            </button>
          </div>

          <div class="col-2">
            <button class="homeCard card-b" onclick="InfoChange('goods')">
              <i class="fa-solid fa-clover"></i><br/>
              委託<br/>項目
            </button>
          </div>

          <div class="col-2">
            <button class="homeCard card-a"  onclick="InfoChange('attention')">
              <i class="fa-solid fa-circle-exclamation"></i><br/>
              注意/<br/>流程
            </button>
          </div>

          <div class="col-2">
            <button class="homeCard card-b" onclick="InfoChange('schedule')">
              <i class="fa-solid fa-calendar-days"></i><br/>
              排單
            </button>
          </div>

          <div class="col-2">
            <button class="homeCard card-a">
              <i class="fa-solid fa-palette"></i><br/>
              用色
            </button>
          </div>

          <div class="col-1"></div>

        </div>
      </div>

      <!-- 關於 -->
      <div id="info-partial" class="container"></div> 



      <footer>
        ─────────────────────────
        <p > 最後更新日 : 2026/07/15</p>
      </footer>

    </div> 

    <script src="./js/partial.js"></script>
  </body>
  
</html>
