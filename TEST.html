<style>
  .image-card {
  display: flex;
  width: 100%;
  max-width: 800px;
  margin: 20px auto 40px; /* 下方留一點空間給尖角 */
  background-color: #fff; /* 必須有背景色，尖角才不會斷層 */
  border-radius: 20px;
  /* overflow: hidden;  <-- 注意：這裡要移除，否則尖角會被切掉 */
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  height: 400px;
  position: relative; /* 讓尖角可以定位 */
}

/* 為了讓圓角依然有效，我們要把 overflow: hidden 改到內層 */
.main-img-box, .side-column {
  overflow: hidden;
}
/* 讓左側大圖左邊有圓角 */
.main-img-box {
  border-top-left-radius: 20px;
  border-bottom-left-radius: 20px;
}
/* 讓右側小圖右邊有圓角 */
.side-column {
  border-top-right-radius: 20px;
  border-bottom-right-radius: 20px;
}

/* --- 對話泡泡尖角 --- */
.image-card::after {
  content: "";
  position: absolute;
  bottom: -20px;    /* 尖角的高度 */
  left:45vw;       /* 尖角距離左邊的位置 */
  
  /* 繪製三角形 */
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 20px 15px 0 15px; /* 上、右、下、左 */
  border-color: #fff transparent transparent transparent; /* 顏色要跟背景色一樣 */
  
  /* 如果想要尖角也有陰影 (選配) */
  filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1));
}
</style>

<div class="image-card">
  <div class="main-img-box">
    <img src="Image/sample/Q/Q_img_01.png" alt="Main" class="main-img">
  </div>
  
  <div class="side-column">
    <img src="Image/sample/Q/Q_img_02.png" alt="Sub 1" class="sub-img">
    <img src="Image/sample/Q/Q_img_03.png" alt="Sub 2" class="sub-img">
    <img src="Image/sample/Q/Q_img_04.png" alt="Sub 3" class="sub-img">
  </div>
</div>
